name: Native R6 candidate CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-r6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: native-r6

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Validate governed release schema
        working-directory: .
        run: |
          set -euo pipefail
          python tools/native-r6/verify_asset_ledger.py
          python tools/native-r6/verify_release_gates.py

      - name: Fail closed until exact native R6 source is imported
        working-directory: .
        run: |
          set -euo pipefail
          python tools/native-r6/verify_import.py

      - name: Capture deterministic native source inventory
        working-directory: .
        run: |
          set -euo pipefail
          python tools/native-r6/inventory_source.py --output r6-source-inventory.json

      - name: Upload source inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: omsaravanabhava-r6-source-inventory
          path: r6-source-inventory.json
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: native-r6/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check when defined
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck?0:1)"; then
            pnpm run typecheck
          elif node -e "const p=require('./package.json'); process.exit(p.scripts?.['type-check']?0:1)"; then
            pnpm run type-check
          else
            echo 'No explicit typecheck script; required production build remains authoritative.'
          fi

      - name: Lint when defined
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint?0:1)"; then
            pnpm run lint
          else
            echo 'No explicit lint script.'
          fi

      - name: Test when defined
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test?0:1)"; then
            pnpm test
          else
            echo 'No explicit test script; browser/release evidence remains mandatory before production.'
          fi

      - name: Required native production build
        run: pnpm run build

      - name: Locate production web artifact
        run: |
          set -euo pipefail
          if [ -s dist/public/index.html ]; then
            echo 'WEB_ARTIFACT=dist/public' >> "$GITHUB_ENV"
          elif [ -s dist/index.html ]; then
            echo 'WEB_ARTIFACT=dist' >> "$GITHUB_ENV"
          else
            echo 'No Vite web production artifact found at dist/public or dist.' >&2
            exit 1
          fi

      - name: Static release safety checks
        run: |
          set -euo pipefail
          test -n "${WEB_ARTIFACT:-}"
          grep -RqiE 'OmSaravanaBhava|Om Saravana Bhava|ஓம் சரவணபவ' "$WEB_ARTIFACT"
          ! grep -RniE 'https://kandan\.omsaravanabhava\.org|ssakthivel02/kandan-legacy|ssakthivel02/kirthiverse|ssakthivel02/ramaverse|ssakthivel02/divyanexus|ssakthivel02/osb-web|sakthiai\.omsaravanabhava\.org|saravanai\.omsaravanabhava\.org' "$WEB_ARTIFACT"
          ! grep -RniE 'api[_-]?key[[:space:]]*[:=]|secret[[:space:]]*[:=]|password[[:space:]]*[:=]' "$WEB_ARTIFACT"

      - name: Upload native R6 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: omsaravanabhava-native-r6-preview
          path: native-r6/${{ env.WEB_ARTIFACT }}
          if-no-files-found: error
          retention-days: 14
