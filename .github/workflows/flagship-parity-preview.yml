name: Native R6 candidate CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-r6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: native-r6

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Fail closed until native R6 source is imported
        working-directory: .
        run: |
          set -euo pipefail
          test -d native-r6
          test -s native-r6/package.json
          test -s native-r6/pnpm-lock.yaml
          test -s native-r6/IMPORT_PROVENANCE.json

      - name: Verify import provenance contract
        working-directory: .
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('native-r6/IMPORT_PROVENANCE.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['project'] == 'OmSaravanaBhava'
          assert data['sourcePackage'] == 'OmSaravanaBhava_R6_FINAL_MANUS_MASTER_SOURCE.zip'
          assert data['sourceSha256'] == '3477dd375e9545bd51482f9cacabe851adc6a841cdf111ffd5eb408f76c26585'
          assert data['importMode'] == 'native-source-only'
          assert data['productionAuthorized'] is False
          PY

      - name: Reject cross-project technical contamination
        run: |
          set -euo pipefail
          if grep -RniE 'kandan-legacy|kirthiverse|ramaverse|divyanexus|sakthiai|saravanai|osb-web' . \
            --exclude-dir=node_modules --exclude-dir=.git; then
            echo 'Cross-project technical contamination detected in native-r6 source.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: native-r6/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check when defined
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck?0:1)" && pnpm run typecheck || \
          node -e "const p=require('./package.json'); process.exit(p.scripts?.['type-check']?0:1)" && pnpm run type-check || \
          echo 'No explicit typecheck script; continuing to required build.'

      - name: Lint when defined
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts?.lint?0:1)" && pnpm run lint || \
          echo 'No explicit lint script; continuing to required build.'

      - name: Test when defined
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts?.test?0:1)" && pnpm test -- --runInBand || \
          echo 'No compatible test script detected; browser/release gates remain required before production.'

      - name: Required native production build
        run: pnpm run build

      - name: Locate production web artifact
        run: |
          set -euo pipefail
          if [ -s dist/public/index.html ]; then
            echo 'WEB_ARTIFACT=dist/public' >> "$GITHUB_ENV"
          elif [ -s dist/index.html ]; then
            echo 'WEB_ARTIFACT=dist' >> "$GITHUB_ENV"
          else
            echo 'No Vite web production artifact found at dist/public or dist.' >&2
            exit 1
          fi

      - name: Static release safety checks
        run: |
          set -euo pipefail
          test -n "${WEB_ARTIFACT:-}"
          grep -RqiE 'OmSaravanaBhava|Om Saravana Bhava|ஓம் சரவணபவ' "$WEB_ARTIFACT"
          ! grep -RniE 'https://kandan\.omsaravanabhava\.org|kandan-legacy|kirthiverse|ramaverse|divyanexus|sakthiai|saravanai|osb-web' "$WEB_ARTIFACT"
          ! grep -RniE 'api[_-]?key[[:space:]]*[:=]|secret[[:space:]]*[:=]|password[[:space:]]*[:=]' "$WEB_ARTIFACT"

      - name: Upload native R6 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: omsaravanabhava-native-r6-preview
          path: native-r6/${{ env.WEB_ARTIFACT }}
          if-no-files-found: error
          retention-days: 14
