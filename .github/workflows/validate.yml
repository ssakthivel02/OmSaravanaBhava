name: Validate native R6 governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify reconstruction authority
        shell: bash
        run: |
          set -euo pipefail
          test -s RECONSTRUCTION_NATIVE_SOURCE.md
          test -s docs/NATIVE_SOURCE_INVENTORY.md
          test -s docs/R6_ASSET_RECONCILIATION.csv
          test -s docs/R6_BROWSER_QA_MATRIX.csv
          test -s docs/R6_PREMIUM_EXPERIENCE_CONTRACT.md
          test -s native-r6/IMPORT_PROVENANCE.json
          test -s release/R6_RELEASE_GATES.json
          test -s release/R6_PERFORMANCE_BUDGET.json
          test -s tools/native-r6/import_verified_archive.py
          test -s tools/native-r6/inventory_source.py
          test -s tools/native-r6/discover_asset_refs.py
          test -s tools/native-r6/verify_import.py
          test -s tools/native-r6/verify_asset_ledger.py
          test -s tools/native-r6/verify_release_gates.py
          grep -q 'OmSaravanaBhava_R6_FINAL_MANUS_MASTER_SOURCE.zip' RECONSTRUCTION_NATIVE_SOURCE.md
          grep -q '3477dd375e9545bd51482f9cacabe851adc6a841cdf111ffd5eb408f76c26585' RECONSTRUCTION_NATIVE_SOURCE.md
          grep -q 'native-source-only' native-r6/IMPORT_PROVENANCE.json

      - name: Compile governance recovery and inventory tools
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/native-r6/import_verified_archive.py \
            tools/native-r6/inventory_source.py \
            tools/native-r6/discover_asset_refs.py \
            tools/native-r6/verify_import.py \
            tools/native-r6/verify_asset_ledger.py \
            tools/native-r6/verify_release_gates.py

      - name: Validate asset ledger release schema and performance budget
        shell: bash
        run: |
          set -euo pipefail
          python tools/native-r6/verify_asset_ledger.py
          python tools/native-r6/verify_release_gates.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('release/R6_PERFORMANCE_BUDGET.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['project'] == 'OmSaravanaBhava'
          assert data['candidate'] == 'native-r6'
          assert data['webVitals']['lcpMsMax'] <= 2500
          assert data['webVitals']['inpMsMax'] <= 200
          assert data['webVitals']['clsMax'] <= 0.1
          assert data['labTargets']['mobileLighthousePerformanceMin'] >= 90
          assert data['releaseGate']['id'] == 'PERF-001'
          assert data['releaseGate']['blocking'] is True
          print('R6_PERFORMANCE_BUDGET_SCHEMA=PASS')
          PY

      - name: Verify premium experience contract minimums
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Tamil-first devotional hierarchy' docs/R6_PREMIUM_EXPERIENCE_CONTRACT.md
          grep -q 'Canonical devotional text is a first-class reading surface' docs/R6_PREMIUM_EXPERIENCE_CONTRACT.md
          grep -q 'Arabic additionally requires true RTL layout qualification' docs/R6_PREMIUM_EXPERIENCE_CONTRACT.md
          grep -q 'world-class experience' docs/R6_PREMIUM_EXPERIENCE_CONTRACT.md

      - name: Verify production is explicit and fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/deploy-pages.yml').read_text(encoding='utf-8')
          low=text.lower()
          assert 'workflow_dispatch:' in text
          assert '\n  push:' not in text
          assert 'expected_sha:' in text
          assert 'production_approved:' in text
          assert 'verify_import.py' in text
          assert 'verify_asset_ledger.py --require-resolved' in text
          assert 'verify_release_gates.py --require-pass' in text
          assert 'repository: ssakthivel02/kandan-legacy' not in low
          assert 'donor_sha:' not in low
          assert 'build governed donor artifact' not in low
          PY

      - name: Verify donor build removed from native candidate CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/flagship-parity-preview.yml').read_text(encoding='utf-8').lower()
          assert 'repository: ssakthivel02/kandan-legacy' not in text
          assert 'donor_sha:' not in text
          assert 'checkout pinned kandan donor' not in text
          assert 'build donor governed artifact' not in text
          assert 'verify_import.py' in text
          assert 'verify_asset_ledger.py' in text
          assert 'verify_release_gates.py' in text
          assert 'inventory_source.py' in text
          assert 'discover_asset_refs.py' in text
          assert 'working-directory: native-r6' in text
          assert 'pnpm run build' in text
          PY

      - name: Repository secret-pattern safety scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'api[_-]?key[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+|secret[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+|password[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+' . \
            --exclude-dir=.git --exclude='validate.yml'
