name: Deploy approved native OmSaravanaBhava R6

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact candidate commit SHA approved for production'
        required: true
        type: string
      production_approved:
        description: 'Owner explicitly approved this exact candidate for production'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: omsaravanabhava-native-r6-production
  cancel-in-progress: false

jobs:
  build-validate:
    if: ${{ inputs.production_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: native-r6

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Enforce exact approved SHA
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact candidate confirmed: $ACTUAL_SHA"

      - name: Verify exact native R6 import
        working-directory: .
        run: |
          set -euo pipefail
          python tools/native-r6/verify_import.py
          python tools/native-r6/inventory_source.py --output r6-source-inventory.json

      - name: Require all 52 R6 asset dispositions resolved
        working-directory: .
        run: |
          set -euo pipefail
          python tools/native-r6/verify_asset_ledger.py --require-resolved

      - name: Require all pre-owner release gates PASS
        working-directory: .
        run: |
          set -euo pipefail
          python tools/native-r6/verify_release_gates.py --require-pass

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: native-r6/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check when defined
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck?0:1)"; then
            pnpm run typecheck
          elif node -e "const p=require('./package.json'); process.exit(p.scripts?.['type-check']?0:1)"; then
            pnpm run type-check
          fi

      - name: Lint when defined
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint?0:1)"; then
            pnpm run lint
          fi

      - name: Test when defined
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test?0:1)"; then
            pnpm test
          fi

      - name: Required native production build
        run: pnpm run build

      - name: Resolve web artifact
        run: |
          set -euo pipefail
          if [ -s dist/public/index.html ]; then
            echo 'WEB_ARTIFACT=dist/public' >> "$GITHUB_ENV"
          elif [ -s dist/index.html ]; then
            echo 'WEB_ARTIFACT=dist' >> "$GITHUB_ENV"
          else
            echo 'No production web artifact found.' >&2
            exit 1
          fi

      - name: Production artifact safety gate
        run: |
          set -euo pipefail
          grep -RqiE 'OmSaravanaBhava|Om Saravana Bhava|ஓம் சரவணபவ' "$WEB_ARTIFACT"
          ! grep -RniE 'https://kandan\.omsaravanabhava\.org|ssakthivel02/kandan-legacy|ssakthivel02/kirthiverse|ssakthivel02/ramaverse|ssakthivel02/divyanexus|ssakthivel02/osb-web|sakthiai\.omsaravanabhava\.org|saravanai\.omsaravanabhava\.org' "$WEB_ARTIFACT"
          ! grep -RniE 'api[_-]?key[[:space:]]*[:=]|secret[[:space:]]*[:=]|password[[:space:]]*[:=]' "$WEB_ARTIFACT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact approved Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: native-r6/${{ env.WEB_ARTIFACT }}

  deploy:
    if: ${{ inputs.production_approved == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy exact approved native R6 artifact
        id: deployment
        uses: actions/deploy-pages@v4
