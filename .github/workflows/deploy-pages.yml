name: Deploy OmSaravanaBhava flagship parity

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DONOR_SHA: 5d2670e286d0a32df2e564a2c280fa976866facf

concurrency:
  group: omsaravanabhava-pages-production
  cancel-in-progress: false

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout flagship overlay
        uses: actions/checkout@v6
        with:
          path: flagship
      - name: Checkout pinned Kandan donor
        uses: actions/checkout@v6
        with:
          repository: ssakthivel02/kandan-legacy
          ref: ${{ env.DONOR_SHA }}
          path: donor
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify immutable donor pin
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DONOR_SHA"
      - name: Build governed donor artifact
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/phase-c-h/build_route_recovery.py tools/phase-c-h/run_route_recovery.py tools/phase-c-h/build_content_completeness.py tools/phase-c-h/build_capability_matrix.py tools/phase-c-h/build_public_site.py tools/phase-c-h/validate_public_site.py
          python tools/phase-c-h/run_route_recovery.py
          python tools/phase-c-h/build_content_completeness.py
          python tools/phase-c-h/build_capability_matrix.py
          python tools/phase-c-h/build_public_site.py
          mkdir -p _site/data/research-intake
          cp data/research-intake/popular-song-triage-2026-07-22.json _site/data/research-intake/
          cp data/research-intake/muththaiththaru-numbering-reconciliation-2026-07-22.json _site/data/research-intake/
          python tools/phase-c-h/validate_public_site.py
      - name: Apply additive OmSaravanaBhava flagship layer
        shell: bash
        run: |
          set -euo pipefail
          cp flagship/assets/css/flagship-nextgen.css donor/assets/css/flagship-nextgen.css
          cp flagship/assets/js/flagship-nextgen.js donor/assets/js/flagship-nextgen.js
          python flagship/tools/flagship-overlay.py donor/_site
      - name: Production parity gate
        shell: bash
        run: |
          set -euo pipefail
          test -s donor/_site/index.html
          test -s donor/_site/temples.html
          test -s donor/_site/murugan-song-library.html
          test -s donor/_site/thiruppugazh.html
          test -s donor/_site/ai-search.html
          test -s donor/_site/site-directory.html
          test -s donor/_site/offline.html
          test -s donor/_site/service-worker.js
          test -s donor/_site/manifest.json
          test -s donor/_site/flagship-release.json
          grep -q 'https://omsaravanabhava.org/' donor/_site/index.html
          grep -q 'OmSaravanaBhava' donor/_site/index.html
          ! grep -q 'https://kandan.omsaravanabhava.org' donor/_site/index.html
          grep -q 'flagship-nextgen.css' donor/_site/index.html
          grep -q 'flagship-nextgen.js' donor/_site/index.html
          grep -q 'prefers-reduced-motion' donor/_site/assets/css/flagship-nextgen.css
          node --check donor/_site/assets/js/flagship-nextgen.js
          node --check donor/_site/service-worker.js
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('donor/_site')
          rel=json.loads((root/'flagship-release.json').read_text())
          assert rel['donorCommit']=='5d2670e286d0a32df2e564a2c280fa976866facf'
          assert rel['htmlPageCount'] >= 100
          m=json.loads((root/'manifest.json').read_text())
          assert m.get('name') == 'OmSaravanaBhava'
          print(json.dumps(rel, indent=2))
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: donor/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy validated OmSaravanaBhava artifact
        id: deployment
        uses: actions/deploy-pages@v4
